function makeIcon(name) {
  return function Icon(props) {
    const {
      size = 24,
      color = "currentColor",
      ...rest
    } = props || {};
    const data = window.lucide && window.lucide.icons && window.lucide.icons[name] || [];
    const kids = data.map((node, i) => React.createElement(node[0], {
      key: i,
      ...node[1]
    }));
    return React.createElement("svg", {
      width: size,
      height: size,
      viewBox: "0 0 24 24",
      fill: "none",
      stroke: color,
      strokeWidth: 2,
      strokeLinecap: "round",
      strokeLinejoin: "round",
      ...rest
    }, kids);
  };
}
